<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Card Sold Tracker</title><style>
:root{--bg:#0d1220;--panel:#171f31;--panel2:#1d2940;--text:#eaf0fc;--muted:#91a0b9;--line:#2a3751;--accent:#f1c451;--blue:#81b7ff;--green:#6bd8aa;--red:#f58991}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px}header{background:linear-gradient(135deg,#1b3156,#141e35);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);padding:16px 18px 12px}header small{color:var(--accent);font-size:10px;font-weight:900;letter-spacing:2px}header h1{margin:2px 0 12px;font-size:22px}nav{display:flex;gap:7px}nav button{flex:1;border-radius:9px;padding:10px 2px;font-size:12px}.nav-on{background:var(--accent)!important;color:#101828!important}main{padding:14px 14px 90px;max-width:850px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px}.card h2{font-size:17px;margin:0 0 12px}.card h3{font-size:14px;margin:13px 0 10px}button{font:inherit;border:1px solid var(--line);border-radius:10px;background:#25324b;color:var(--text);padding:10px 12px;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#141922;border:0}button.alt{background:#25395a;border:1px solid #375278;color:#dce9ff}button.danger{color:var(--red);border-color:#62404d;background:#2d2330}button.tiny{font-size:11px;padding:7px 9px}button:disabled{opacity:.45}button.selected{background:#416391;color:white;border-color:#7ba9e7}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>button{flex-shrink:0}.space{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}.tinytext{font-size:11px}.caps{letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-size:10px;font-weight:900}input,select,textarea{width:100%;font:inherit;color:var(--text);background:#0f1829;padding:11px;border:1px solid #34415c;border-radius:9px;outline:0;min-height:42px}input:focus,textarea:focus{border-color:var(--accent)}label{color:var(--muted);display:block;font-size:12px;margin:0 0 7px;font-weight:700}.field{margin-bottom:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:11px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips button{padding:9px 12px;font-size:12px}.item{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:12px;margin:8px 0}.item-title{font-weight:800}.meta{font-size:11px;color:var(--muted);margin-top:5px}.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}.stat{padding:11px 7px;text-align:center;background:#111a2b;border-radius:11px;border:1px solid #2b3850}.stat b{font-size:19px;color:var(--accent);display:block;word-break:break-word}.stat span{font-size:10px;color:var(--muted)}.big-num{font-size:25px;font-weight:900;color:var(--accent)}.pill{display:inline-block;border-radius:99px;background:#30415d;color:#cbdaf2;padding:4px 8px;font-size:10px;font-weight:700}.pill.verified{background:#21493a;color:#95e9bf}.pill.unverified{background:#514426;color:#e9c971}.pill.excluded{background:#4b2734;color:#f6a5b2}.bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:9px 0}.bar button{flex:1;padding:8px}.hide{display:none!important}canvas{display:block;width:100%;height:200px;background:#111a2b;border-radius:10px;border:1px solid var(--line);margin-top:12px}.empty{color:var(--muted);text-align:center;padding:26px 10px;border:1px dashed #44516b;border-radius:11px}.divider{height:1px;background:var(--line);margin:15px 0}.search-badge{padding:9px;border-radius:10px;background:#121c31;margin:8px 0;display:flex;gap:8px;align-items:center}.search-badge span{flex:1;overflow-wrap:anywhere}.search-badge button{font-size:11px}.inline-input{display:flex;gap:8px}.inline-input input{flex:1}.inline-input button{white-space:nowrap}.help{line-height:1.55;color:var(--muted);font-size:12px}.warning{background:#352e1f;border:1px solid #65522d;border-radius:11px;padding:12px;line-height:1.5;color:#ecd293;font-size:12px}.green{color:var(--green)}.red{color:var(--red)}.hint{padding:8px 0 4px;font-size:12px;color:#bdd6fd}.hint strong{color:var(--accent)}.switch{display:flex;align-items:center;gap:9px;line-height:1.3}.switch input{width:20px;height:20px;min-height:auto;accent-color:#f1c451}details{margin:11px 0}summary{cursor:pointer;font-weight:800;color:var(--blue)}textarea{min-height:90px;resize:vertical}#toast{position:fixed;bottom:20px;left:20px;right:20px;max-width:600px;margin:auto;background:#e5eefc;color:#182336;border-radius:9px;padding:14px;box-shadow:0 8px 30px #0009;z-index:20;font-weight:750;display:none;white-space:pre-wrap}.badge-count{color:var(--accent);margin-left:5px}a{color:var(--blue)}footer{text-align:center;padding:8px;color:var(--muted);font-size:11px}.select-card{display:flex;justify-content:space-between;align-items:center;gap:9px}.select-card .name{font-size:17px;font-weight:900}.select-card p{margin:4px 0 0;color:var(--muted);font-size:12px}@media(min-width:700px){main{padding:22px 20px 100px}.stat b{font-size:24px}} </style></head><body><header><small>MIKE'S CARD TOOLS</small><h1>Sold Price Tracker</h1><nav><button id="nav-trackers" onclick="switchTab('trackers')">Trackers</button><button id="nav-detail" onclick="switchTab('detail')">Analysis</button><button id="nav-sales" onclick="switchTab('sales')">Sales</button><button id="nav-settings" onclick="switchTab('settings')">Settings</button></nav></header><main id="main"></main><div id="toast"></div>
<script>
'use strict';
const KEY='pokemon_sold_tracker_v1';const D={trackers:[],sales:[],settings:{monitor:false,scanMinutes:30},version:1};let data,active=null,tab='trackers',period=30,editSale=null,scanLock=false,scanQueue=[],scanCompleted=0;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);const money=n=>Number.isFinite(+n)?'£'+(+n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));data=d&&Array.isArray(d.trackers)&&Array.isArray(d.sales)?{...structuredClone(D),...d}:structuredClone(D)}catch(e){data=structuredClone(D)}if(data.trackers.length)active=data.trackers[0].id}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(s){const el=$('toast');el.textContent=s;el.style.display='block';setTimeout(()=>{el.style.display='none'},3700)}
function tr(){return data.trackers.find(t=>t.id===active)}
function switchTab(v){tab=v;render()}
function render(){for(const k of ['trackers','detail','sales','settings'])$('nav-'+k).classList.toggle('nav-on',tab===k);$('main').innerHTML=({trackers:renderTrackers,detail:renderDetail,sales:renderSales,settings:renderSettings}[tab])();if(tab==='detail')setTimeout(drawChart,0)}
function renderTrackers(){let h=`<div class="card"><h2>Track one card, several search terms</h2><p class="help">Give the card a name and exact printed card number. Each tracker can contain several separate eBay searches, all feeding into one deduplicated price history.</p><div class="field"><label>Card name</label><input id="new-name" placeholder="e.g. Charizard ex"></div><div class="cols"><div class="field"><label>Card number</label><input id="new-number" placeholder="e.g. 199/165"></div><div class="field"><label>Set (optional)</label><input id="new-set" placeholder="e.g. 151"></div></div><div class="field"><label>Condition</label><select id="new-condition"><option value="graded">Graded</option><option value="raw">Ungraded</option><option value="any">Any</option></select></div><button class="primary" onclick="createTracker()">+ Create card tracker</button></div><div class="card"><h2>Saved trackers <span class="badge-count">${data.trackers.length}</span></h2>`;if(!data.trackers.length)h+='<div class="empty">No trackers yet. Add a card above to start.</div>';for(const t of data.trackers){const s=data.sales.filter(x=>x.tracker===t.id&&!x.excluded&&x.verified);let ps=s.map(x=>x.price);h+=`<div class="item select-card"><div><div class="name">${esc(t.name)} <span class="pill">#${esc(t.number||'—')}</span></div><p>${esc(t.set||'No set')} · ${esc(t.condition)} · ${t.searches.length} searches · ${s.length} confirmed sales</p><p>${ps.length?'Average '+money(ps.reduce((a,b)=>a+b,0)/ps.length):'No confirmed prices yet'}</p></div><button class="primary tiny" onclick="openTracker('${t.id}')">View</button></div>`}return h+'</div>'}
function createTracker(){let name=$('new-name').value.trim(),number=$('new-number').value.trim(),set=$('new-set').value.trim(),condition=$('new-condition').value;if(!name||!number){toast('Enter a card name AND its printed card number.');return}let t={id:uid(),name,number,set,condition,graders:['PSA','ACE','TAG'],grades:[10,9,8],searches:[],created:new Date().toISOString()};data.trackers.unshift(t);active=t.id;save();tab='detail';render();toast('Tracker created. Add searches below.')}
function openTracker(id){active=id;tab='detail';render()}
function chips(arr,selected,fn){return arr.map(v=>`<button class="${selected.includes(v)?'selected':''}" onclick="${fn}('${v}')">${esc(v)}</button>`).join('')}
function renderDetail(){const t=tr();if(!t)return `<div class="card"><div class="empty">Choose a saved tracker first.</div><button onclick="switchTab('trackers')">Back to trackers</button></div>`;const inRange=verifiedSales(period);const vals=inRange.map(s=>s.price);const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:NaN;const sorted=[...vals].sort((a,b)=>a-b);const mid=sorted.length?sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2:NaN;let h=`<div class="card"><div class="row space"><div><span class="caps">Card tracker</span><h2 style="margin:4px 0 4px">${esc(t.name)} <span class="pill">#${esc(t.number)}</span></h2><div class="muted small">${esc(t.set||'Set unspecified')} · ${esc(t.condition)}</div></div><button class="tiny" onclick="switchTab('trackers')">All cards</button></div><div class="divider"></div><label>Grading companies (pick one or more)</label><div class="chips">${chips(['PSA','ACE','TAG'],t.graders,'toggleGrader')}</div><div style="height:13px"></div><label>Grades (pick one or more)</label><div class="chips">${chips([8,9,10],t.grades.map(String),'toggleGrade')}</div><div style="height:13px"></div><label>Condition</label><div class="chips">${chips(['graded','raw','any'],[t.condition],'setCondition')}</div><p class="help">These filters are checked against listing titles when results are captured; use different trackers to compare prices of different grades rather than unintentionally mixing them.</p></div>`;
h+=`<div class="card"><h2>Combined sold price</h2><div class="bar">${[[7,'1 week'],[30,'1 month'],[90,'3 months'],[180,'6 months']].map(([d,s])=>`<button class="${period===d?'selected':''}" onclick="setPeriod(${d})">${s}</button>`).join('')}</div><div class="stat-grid"><div class="stat"><b>${money(avg)}</b><span>Mean price</span></div><div class="stat"><b>${money(mid)}</b><span>Median price</span></div><div class="stat"><b>${vals.length}</b><span>Verified sales</span></div></div><canvas id="chart"></canvas><p class="help">Chart uses confirmed individual sale prices, not listing asking prices or averages of different searches. Sales imported from different searches are deduplicated by eBay item ID. Six months requires historical/imported records because ordinary eBay sold searches are limited to recent sales.</p></div>`;
h+=`<div class="card"><div class="row space"><h2>Searches (${t.searches.length})</h2><button class="tiny alt" onclick="scanAll()">↻ Check all</button></div><p class="help">Add searches separately. For example, use an alternate spelling or grade wording, then combine every relevant sale. Searches use eBay UK sold items and UK-only seller location.</p><div class="field"><label>One eBay search phrase</label><div class="inline-input"><input id="search-term" placeholder="e.g. Charizard ex 199/165 PSA 10"><button class="primary" onclick="addSearch()">+ Add</button></div></div><button class="tiny" onclick="addSuggestedSearch()">+ Add suggested search</button>`;for(const s of t.searches){h+=`<div class="search-badge"><span>${esc(s.query)}<div class="muted tinytext">${s.lastChecked?('Last checked '+new Date(s.lastChecked).toLocaleString('en-GB')):'Never checked'}</div></span><button class="tiny" onclick="openSearch('${s.id}')">Open</button><button class="tiny alt" onclick="checkSearch('${s.id}')">Check</button><button class="tiny danger" onclick="deleteSearch('${s.id}')">×</button></div>`}h+=`<div class="divider"></div><div class="switch"><input type="checkbox" ${t.monitor?'checked':''} onchange="toggleTrackerMonitor(this.checked)"><span>Include these searches in automatic checks while app is open</span></div><div class="row" style="margin-top:12px"><button onclick="tab='sales';render()">Review captured sales</button><button onclick="addManualSale()">+ Add verified sale</button></div></div>`;let last=data.sales.filter(s=>s.tracker===t.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));h+=`<div class="card"><div class="row space"><h2>Latest sale records</h2><span class="muted small">${last.length} stored</span></div>${last.length?last.slice(0,7).map(s=>saleCard(s)).join(''):'<div class="empty">No sales recorded. Check a search or add confirmed Product Research sales.</div>'}</div><button class="danger" onclick="deleteTracker()">Delete this tracker</button>`;return h}
function toggleTrackerMonitor(val){tr().monitor=!!val;save()}
function setPeriod(n){period=n;render()}
function toggleGrader(x){const t=tr();t.graders=t.graders.includes(x)?t.graders.filter(v=>v!==x):[...t.graders,x];save();render()}
function toggleGrade(x){const t=tr();let n=Number(x);t.grades=t.grades.includes(n)?t.grades.filter(v=>v!==n):[...t.grades,n];save();render()}
function setCondition(x){tr().condition=x;save();render()}
function addSearch(q){const t=tr();if(!t)return;let phrase=q||$('search-term').value.trim();if(!phrase){toast('Type a search phrase.');return}if(t.searches.some(s=>s.query.toLowerCase()===phrase.toLowerCase())){toast('This search is already saved.');return}t.searches.push({id:uid(),query:phrase,lastChecked:null});save();render();toast('Search added.')}
function addSuggestedSearch(){let t=tr();let options=t.condition==='graded'?t.graders.flatMap(g=>t.grades.map(n=>g+' '+n)):t.condition==='raw'?['raw','ungraded']:[''];let candidates=options.map(s=>['pokemon',t.name,t.number,t.set,s].filter(Boolean).join(' '));let next=candidates.find(q=>!t.searches.some(x=>x.query.toLowerCase()===q.toLowerCase()));if(next)addSearch(next);else toast('All suggested combinations are already saved. Add a custom search phrase.')}
function deleteSearch(id){if(!confirm('Remove this saved search? Imported sales remain.'))return;tr().searches=tr().searches.filter(x=>x.id!==id);save();render()}
function deleteTracker(){if(!confirm('Delete this tracker and ALL of its saved sale records?'))return;data.sales=data.sales.filter(x=>x.tracker!==active);data.trackers=data.trackers.filter(x=>x.id!==active);active=data.trackers[0]?.id||null;save();switchTab('trackers')}
function soldUrl(query){return 'https://www.ebay.co.uk/sch/i.html?_nkw='+encodeURIComponent(query)+'&LH_Sold=1&LH_Complete=1&LH_PrefLoc=1&_sop=13&_ipg=120'}
function openSearch(id){const t=tr();const s=t?.searches.find(s=>s.id===id);if(!s)return;if(window.AndroidBridge?.openEbay){AndroidBridge.openEbay(soldUrl(s.query),t.id,s.id)}else{window.open(soldUrl(s.query),'_blank')}}
function checkSearch(id){const s=tr()?.searches.find(s=>s.id===id);if(s)startScan([{url:soldUrl(s.query),tracker:tr().id,search:s.id}])}
function scanAll(){const t=tr();if(!t)return;startScan(t.searches.map(s=>({url:soldUrl(s.query),tracker:t.id,search:s.id})))}
function startScan(jobs){if(!jobs.length){toast('Add at least one search first.');return}if(!window.AndroidBridge?.startScan){toast('Automatic capture requires the installed Android application.');return}if(scanLock){toast('A scan is already running.');return}scanLock=true;scanQueue=jobs;scanCompleted=0;toast('Checking '+jobs.length+' search(es)…');AndroidBridge.startScan(JSON.stringify(jobs))}
function onScanProgress(message){toast(message)}
function onScanFinished(){scanLock=false;save();render();toast('Check completed. Review any captured prices before including them in the chart.')}
function onNativeCapture(input){let payload;try{payload=typeof input==='string'?JSON.parse(input):input}catch(e){toast('Capture failed: invalid data.');return}let job=payload.job||{},arr=payload.sales||[];const t=data.trackers.find(x=>x.id===job.tracker);if(!t)return;let search=t.searches.find(x=>x.id===job.search);if(search)search.lastChecked=new Date().toISOString();let added=0,skipped=0;for(let s of arr){if(!s.title||!Number.isFinite(+s.price)||+s.price<=0)continue;if(!matchCard(t,s.title)){skipped++;continue}let id=extractId(s.url)||s.id||hash(s.url||s.title+s.price);let key=t.id+':'+id;let existing=data.sales.find(x=>x.key===key);if(existing){if(!existing.searches.includes(job.search))existing.searches.push(job.search);continue}data.sales.push({key,id:uid(),tracker:t.id,searches:[job.search],title:s.title,price:Number(s.price),date:validDate(s.date),url:s.url||'',source:'eBay sold listing (unverified price)',verified:false,offer:!!s.offer,excluded:false,added:new Date().toISOString()});added++}save();if(tab==='sales'||tab==='detail')render();if(added){if(window.AndroidBridge?.onNewSales)AndroidBridge.onNewSales(added,esc(t.name));toast(added+' new potential sales captured. Verify actual prices first.')}else{toast('No new matching sales for '+t.name+(skipped?' ('+skipped+' filtered out)':''))}}
function matchCard(t,title){let x=title.toLowerCase();let clean=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(t.number){let n=t.number.toLowerCase(),compact=clean(n);if(!x.includes(n)&&!clean(x).includes(compact))return false}let cardName=(t.name||'').toLowerCase().trim().split(/\s+/).find(w=>w.length>2);if(cardName&&!x.includes(cardName))return false;const blocked=['proxy card','replica','reprint','custom card','digital card','empty box','booster box','bundle','lot of','mystery pack'];if(blocked.some(w=>x.includes(w)))return false;let hasGrade=/\b(?:psa|ace|tag|cgc|bgs|beckett|sgc)\s*(?:graded|grade|gem|mint|nm|\d)/i.test(title)||/\bgraded\s+\d{1,2}\b/i.test(title);if(t.condition==='raw'&&hasGrade)return false;if(t.condition==='graded'){if(!t.graders.length||!t.grades.length)return false;let pattern=t.graders.some(g=>t.grades.some(n=>new RegExp('\\b'+g+'\\s*(?:graded\\s*)?(?:gem\\s*mint\\s*)?'+n+'\\b','i').test(title)));if(!pattern)return false}return true}
function extractId(url){let m=String(url||'').match(/(?:\/itm\/(?:[^/?]*\/)?|[?&]item=)(\d{8,16})/);return m?m[1]:null}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return ''+(h>>>0)}
function validDate(d){if(!d)return null;let v=new Date(d);return Number.isFinite(v.valueOf())?v.toISOString().slice(0,10):null}
function verifiedSales(days){let t=tr();if(!t)return [];let cutoff=Date.now()-days*86400000;return data.sales.filter(x=>x.tracker===t.id&&x.verified&&!x.excluded&&x.date&&new Date(x.date+'T23:59:59').getTime()>=cutoff&&new Date(x.date+'T00:00:00').getTime()<=Date.now())}
function drawChart(){let c=$('chart'),t=tr();if(!c||!t)return;let ctx=c.getContext('2d');let r=c.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);c.width=Math.floor(r.width*dpr);c.height=Math.floor(200*dpr);ctx.scale(dpr,dpr);let w=r.width,h=200,pad={l:48,r:15,t:21,b:28};ctx.clearRect(0,0,w,h);let list=verifiedSales(period).sort((a,b)=>a.date.localeCompare(b.date));let lo=Math.min(...list.map(x=>x.price)),hi=Math.max(...list.map(x=>x.price));if(!list.length){ctx.fillStyle='#a6b4c9';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('No confirmed sales in this period',w/2,h/2);return}lo=Math.max(0,lo*.88);hi=hi*1.12;if(hi===lo)hi+=1;const x0=Date.now()-period*86400000,x1=Date.now(),toX=d=>pad.l+(new Date(d+'T12:00:00').getTime()-x0)/(x1-x0)*(w-pad.l-pad.r),toY=v=>h-pad.b-(v-lo)/(hi-lo)*(h-pad.t-pad.b);ctx.strokeStyle='#384b69';ctx.lineWidth=1;ctx.font='10px system-ui';ctx.fillStyle='#9fabc0';for(let i=0;i<=4;i++){let yy=pad.t+(h-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(w-pad.r,yy);ctx.stroke();ctx.textAlign='right';ctx.fillText('£'+Math.round(hi-(hi-lo)*i/4),pad.l-6,yy+3)}ctx.textAlign='center';ctx.fillText(period+' days ago',pad.l+37,h-7);ctx.fillText('Today',w-pad.r-15,h-7);if(list.length>1){ctx.strokeStyle='#e5c15d';ctx.lineWidth=2;ctx.beginPath();list.forEach((s,i)=>{let px=toX(s.date),py=toY(s.price);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke()}for(const s of list){ctx.fillStyle='#7fb6ff';ctx.beginPath();ctx.arc(toX(s.date),toY(s.price),4,0,Math.PI*2);ctx.fill()}}
function saleCard(s){let status=s.excluded?'<span class="pill excluded">Excluded</span>':s.verified?'<span class="pill verified">Verified sale</span>':`<span class="pill unverified">${s.offer?'Offer — unverified':'Price unverified'}</span>`;return `<div class="item"><div class="row space"><b>${money(s.price)}</b>${status}</div><div class="item-title" style="margin-top:7px">${esc(s.title)}</div><div class="meta">${s.date?esc(s.date):'Sale date unknown'} · ${esc(s.source)}${s.searches?.length?' · '+s.searches.length+' search(es)':''}</div><div class="row" style="margin-top:10px">${s.url?`<button class="tiny" onclick="openLink('${s.id}')">Open eBay</button>`:''}<button class="tiny alt" onclick="editOneSale('${s.id}')">Edit / verify</button><button class="tiny ${s.excluded?'':'danger'}" onclick="toggleExcluded('${s.id}')">${s.excluded?'Restore':'Exclude'}</button></div></div>`}
function renderSales(){const t=tr();if(!t)return '<div class="card">Select a tracker first.</div>';let arr=data.sales.filter(s=>s.tracker===t.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));let verified=arr.filter(s=>s.verified&&!s.excluded).length;return `<div class="card"><div class="row space"><h2>Sold records</h2><button class="primary tiny" onclick="addManualSale()">+ Add sale</button></div><div class="muted small">${esc(t.name)} #${esc(t.number)} · ${verified} verified of ${arr.length} records</div><p class="help">When eBay lists “Best Offer accepted”, the crossed-out asking price is not necessarily the actual amount paid. Open Product Research to confirm it; only verified sale prices count towards charts.</p><div class="row"><button class="tiny alt" onclick="openResearch()">Open eBay Product Research</button><button class="tiny" onclick="switchTab('detail')">Back to graph</button></div></div>${arr.length?arr.map(s=>saleCard(s)).join(''):'<div class="empty">No sold items stored yet.</div>'}`}
function getSale(id){return data.sales.find(x=>x.id===id)}
function openLink(id){let s=getSale(id);if(s?.url){if(window.AndroidBridge?.openExternal)AndroidBridge.openExternal(s.url);else window.open(s.url,'_blank')}}
function openResearch(){let url='https://www.ebay.co.uk/sh/research';if(window.AndroidBridge?.openExternal)AndroidBridge.openExternal(url);else window.open(url,'_blank')}
function toggleExcluded(id){let s=getSale(id);if(s){s.excluded=!s.excluded;save();render()}}
function addManualSale(){editSale=null;editSaleForm()}
function editOneSale(id){editSale=id;editSaleForm()}
function editSaleForm(){let t=tr(),s=editSale?getSale(editSale):null;if(!t)return;let prior=tab;tab='sales';render();$('main').insertAdjacentHTML('afterbegin',`<div class="card" id="sale-editor"><h2>${s?'Edit sold item':'Add confirmed sale'}</h2><div class="field"><label>eBay item title</label><input id="sale-title" value="${esc(s?.title||`${t.name} ${t.number}`)}"></div><div class="cols"><div class="field"><label>Actual price paid (£)</label><input id="sale-price" type="number" min="0.01" step="0.01" value="${esc(s?.price||'')}"></div><div class="field"><label>Date of sale</label><input id="sale-date" type="date" value="${esc(s?.date||new Date().toISOString().slice(0,10))}"></div></div><div class="field"><label>Listing URL (optional)</label><input id="sale-url" value="${esc(s?.url||'')}"></div><div class="switch"><input type="checkbox" id="sale-verified" ${s?s.verified?'checked':'':'checked'}><span>I have confirmed this is the actual sale price (e.g. in Product Research)</span></div><div class="row" style="margin-top:14px"><button class="primary" onclick="saveSale()">Save sale</button><button onclick="render()">Cancel</button>${s?`<button class="danger" onclick="removeSale('${s.id}')">Delete</button>`:''}</div></div>`);window.scrollTo({top:0,behavior:'smooth'})}
function saveSale(){let t=tr(),s=editSale?getSale(editSale):null;let title=$('sale-title').value.trim(),price=Number($('sale-price').value),date=$('sale-date').value,url=$('sale-url').value.trim(),verified=$('sale-verified').checked;if(!title||!Number.isFinite(price)||price<=0||!validDate(date)){toast('Enter a title, valid price and sale date.');return}if(new Date(date+'T00:00:00').getTime()>Date.now()){toast('Sale date cannot be in the future.');return}if(url&&!/^https:\/\/([\w-]+\.)?ebay\.(co\.uk|com)\//i.test(url)){toast('Link must be an eBay item URL.');return}let itemId=extractId(url),key=t.id+':'+(itemId||uid());let prev=data.sales.find(x=>x.key===key&&x.id!==s?.id);if(prev){toast('That eBay item is already saved in this tracker.');return}if(s){Object.assign(s,{title,price,date,url,verified,source:verified?'Confirmed actual sold price':'Manually entered (unverified)',offer:!verified})}else{data.sales.unshift({id:uid(),key,tracker:t.id,searches:[],title,price,date,url,source:verified?'Confirmed actual sold price':'Manually entered (unverified)',verified,offer:!verified,excluded:false,added:new Date().toISOString()})}save();editSale=null;render();toast('Sale saved. '+(verified?'Included in price charts.':'Excluded from charts until verified.'))}
function removeSale(id){if(!confirm('Delete this sale record?'))return;data.sales=data.sales.filter(s=>s.id!==id);save();editSale=null;render()}
function renderSettings(){let count=data.trackers.filter(t=>t.monitor).length;return `<div class="card"><h2>Checking & notifications</h2><div class="switch"><input type="checkbox" ${data.settings.monitor?'checked':''} onchange="setMonitor(this.checked)"><span>Periodically scan selected trackers when this app remains open</span></div><div class="field" style="margin-top:13px"><label>Check interval</label><select id="interval" onchange="setIntervalValue(this.value)">${[15,30,60,120].map(n=>`<option ${data.settings.scanMinutes===n?'selected':''} value="${n}">Every ${n} minutes</option>`).join('')}</select></div><p class="help">${count} card tracker(s) enabled. Android may stop scans when this app is in the background. eBay may require sign-in or block automated reading. New candidates need actual-price verification before appearing in graphs. This is not a guaranteed 24/7 notification service.</p><button class="alt" onclick="checkEnabled()">Check enabled trackers now</button></div><div class="card"><h2>Backup & restore</h2><p class="help">Your saved searches and sold prices are stored locally on this device. Export a backup before uninstalling or changing phones.</p><div class="row"><button onclick="exportData()">Export backup JSON</button><button onclick="showImport()">Import backup</button></div><div id="backup-paste" class="hide"><p class="help">Paste a previously exported JSON backup. Import replaces all data on this device.</p><textarea id="import-json" placeholder="Paste JSON backup"></textarea><button class="danger" onclick="importData()">Replace with backup</button></div></div><div class="card"><h2>Data accuracy</h2><p class="help">The normal eBay sold search can show the original price for Best Offer listings. This app captures candidate sold listings but does not pretend that original asking prices are verified actual sales. To include a candidate in your averages, check its true sale price in eBay Product Research and confirm it in the sale editor.</p><p class="help">UK only applies to the seller location filter in each eBay search. Card number, grade and grading-company filters are checked against listing titles as another precaution; pictures and every listing variation cannot be validated automatically.</p><div class="row"><button onclick="openResearch()">Open Product Research</button><button class="danger" onclick="clearAll()">Erase all app data</button></div></div>`}
function setMonitor(v){data.settings.monitor=!!v;save();if(window.AndroidBridge?.setMonitoring)AndroidBridge.setMonitoring(v,data.settings.scanMinutes);render()}
function setIntervalValue(v){data.settings.scanMinutes=Number(v);save();if(window.AndroidBridge?.setMonitoring)AndroidBridge.setMonitoring(data.settings.monitor,data.settings.scanMinutes)}
function checkEnabled(){let jobs=[];for(const t of data.trackers.filter(x=>x.monitor))for(const s of t.searches)jobs.push({url:soldUrl(s.query),tracker:t.id,search:s.id});startScan(jobs)}
function getMonitorJobs(){let jobs=[];if(data.settings.monitor)for(const t of data.trackers.filter(x=>x.monitor))for(const s of t.searches)jobs.push({url:soldUrl(s.query),tracker:t.id,search:s.id});return JSON.stringify(jobs)}
function exportData(){let content=JSON.stringify({exported:new Date().toISOString(),...data},null,2);if(window.AndroidBridge?.shareText)AndroidBridge.shareText('pokemon_sold_tracker_backup.json',content);else{navigator.clipboard?.writeText(content);toast('Backup JSON copied to clipboard.')}}
function showImport(){$('backup-paste')?.classList.toggle('hide')}
function importData(){try{let d=JSON.parse($('import-json').value);if(!Array.isArray(d.trackers)||!Array.isArray(d.sales))throw Error('Missing trackers or sales arrays.');if(!confirm('Replace ALL stored trackers and sales on this device?'))return;data={...structuredClone(D),...d};active=data.trackers[0]?.id||null;save();switchTab('trackers');toast('Backup restored.')}catch(e){toast('Cannot import: '+e.message)}}
function clearAll(){if(!confirm('Permanently erase all saved cards, searches and sold prices?'))return;data=structuredClone(D);active=null;save();switchTab('trackers')}
function onAppForeground(){if(window.AndroidBridge?.setMonitoring)AndroidBridge.setMonitoring(data.settings.monitor,data.settings.scanMinutes)}
load();render();window.onNativeCapture=onNativeCapture;window.onScanFinished=onScanFinished;window.onScanProgress=onScanProgress;window.getMonitorJobs=getMonitorJobs;window.onAppForeground=onAppForeground;onAppForeground();
</script></body></html>
